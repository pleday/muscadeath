<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0b" />
      <stop offset="60%" stop-color="#121213" />
      <stop offset="100%" stop-color="#19181a" />
    </linearGradient>
    <radialGradient id="spot1" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#b8101c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#b8101c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spot2" cx="80%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#9a9a9c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#9a9a9c" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)" />
  <rect width="1600" height="900" fill="url(#spot1)" />
  <rect width="1600" height="900" fill="url(#spot2)" />
  <!-- light beams -->
  <g opacity="0.12" fill="#ffffff">
    <polygon points="300,0 340,0 520,900 400,900" />
    <polygon points="700,0 730,0 850,900 760,900" />
    <polygon points="1100,0 1140,0 1350,900 1230,900" />
  </g>
  <!-- carved stone ring, echoing the festival emblem -->
  <g transform="translate(800 380)" opacity="0.35" fill="none" stroke="#9a9a9c">
    <circle r="230" stroke-width="10" />
    <circle r="200" stroke-width="2" />
    <g stroke-width="6">
      <line x1="-230" y1="0" x2="-200" y2="0" />
      <line x1="230" y1="0" x2="200" y2="0" />
      <line x1="0" y1="-230" x2="0" y2="-200" />
      <line x1="0" y1="230" x2="0" y2="200" />
    </g>
  </g>
  <!-- crowd silhouette -->
  <g fill="#050505">
    <path d="M0 780 Q40 740 80 780 T160 780 T240 760 T320 780 T400 750 T480 780 T560 760 T640 780 T720 750 T800 780 T880 760 T960 780 T1040 750 T1120 780 T1200 760 T1280 780 T1360 750 T1440 780 T1520 760 T1600 780 V900 H0 Z" />
  </g>
  <!-- stage silhouette shapes (amps/mic stands) -->
  <g fill="#050505">
    <rect x="120" y="680" width="70" height="90" rx="4" />
    <rect x="1400" y="680" width="70" height="90" rx="4" />
    <rect x="770" y="640" width="10" height="140" />
    <circle cx="775" cy="630" r="16" />
  </g>
</svg>

